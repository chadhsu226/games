<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>複利節拍 COMPOUND BEAT | Chad's Game Zone</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060612;
    --bg2: #0d0d24;
    --pink: #ff69b4;
    --yellow: #ffe44d;
    --green: #7fffb0;
    --purple: #a855f7;
    --cyan: #22e0ff;
    --gold: #ffc940;
    --red: #ff5566;
    --text: #e8e8ff;
    --muted: #8888bb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 30%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 55%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 45% 45%, rgba(168,85,247,0.7) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 65% 15%, rgba(255,105,180,0.6) 0%, transparent 100%);
    pointer-events: none; z-index: 0;
  }
  .wrap {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 8px 12px;
    user-select: none; -webkit-user-select: none;
  }
  .topbar {
    width: min(94vw, 440px);
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px;
  }
  .back { color: var(--muted); text-decoration: none; font-size: 0.85rem; }
  .back:hover { color: var(--pink); }
  .mute { background: none; border: 1px solid rgba(136,136,187,0.4); color: var(--muted); border-radius: 14px; padding: 2px 10px; font-size: 0.78rem; cursor: pointer; font-family: inherit; }
  h1 {
    font-family: 'Orbitron', sans-serif; font-weight: 900;
    font-size: clamp(1rem, 4.2vw, 1.35rem); letter-spacing: 0.12em;
    background: linear-gradient(90deg, var(--pink), var(--yellow), var(--green), var(--purple));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 4px; text-align: center;
  }
  .stage {
    position: relative;
    width: min(94vw, 440px, calc((100vh - 74px) * 480 / 760));
    aspect-ratio: 480 / 760;
    border-radius: 14px; overflow: hidden;
    border: 1px solid rgba(168,85,247,0.45);
    box-shadow: 0 0 28px rgba(168,85,247,0.25), 0 0 60px rgba(255,105,180,0.1);
    background: #070718;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 18px 20px; text-align: center;
    background: rgba(6,6,18,0.86);
    backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .ov-title {
    font-family: 'Orbitron', sans-serif; font-weight: 900;
    font-size: clamp(1.3rem, 6.4vw, 1.9rem); letter-spacing: 0.1em;
    background: linear-gradient(90deg, var(--pink), var(--yellow), var(--green));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .ov-sub { font-size: 0.86rem; color: var(--muted); letter-spacing: 0.08em; }
  .rules { text-align: left; font-size: 0.8rem; line-height: 1.7; color: var(--text); max-width: 340px; }
  .rules b.pk { color: var(--pink); } .rules b.yl { color: var(--yellow); }
  .rules b.gr { color: var(--green); } .rules b.rd { color: var(--red); }
  .btn {
    margin-top: 6px; padding: 11px 30px; border: none; border-radius: 28px; cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif; font-weight: 700; font-size: 1rem; letter-spacing: 0.08em;
    background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff;
    box-shadow: 0 0 18px rgba(255,105,180,0.45);
  }
  .btn:active { transform: scale(0.97); }
  .best { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; color: var(--yellow); letter-spacing: 0.08em; }
  .grade { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 3.6rem; line-height: 1; }
  .stats { display: grid; grid-template-columns: auto auto; gap: 4px 18px; font-size: 0.84rem; text-align: left; }
  .stats .k { color: var(--muted); } .stats .v { font-family: 'Orbitron', sans-serif; color: var(--text); text-align: right; }
  .tip { font-size: 0.76rem; color: var(--green); max-width: 330px; line-height: 1.6; }
  .keys-hint { font-size: 0.72rem; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← 遊戲列表</a>
    <button class="mute" id="muteBtn" type="button">🔊 音效</button>
  </div>
  <h1>COMPOUND BEAT 複利節拍</h1>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>

    <div class="overlay" id="ovStart">
      <div class="ov-title">COMPOUND BEAT</div>
      <div class="ov-sub">複利節拍 · 讓每一拍都滾成雪球</div>
      <div class="rules">
        ▸ 音符落到底線時按 <b class="pk">D</b><b class="yl">F</b><b class="gr">J</b><b class="pk">K</b>（或 ← ↓ ↑ →），手機直接點對應軌道。<br>
        ▸ 命中即 <b class="gr">資產複利成長</b>，連擊越高報酬率越高（最多 ×3）。<br>
        ▸ <b class="yl">金色股利</b>音符報酬加倍；漏接 −5% 且連擊歸零。<br>
        ▸ <b class="rd">紅色黑天鵝</b>千萬別碰！碰到 −15%；放它過去反而小賺（避險）。<br>
        ▸ 資產跌破 $400 即破產。三個階段、約 1 分鐘。
      </div>
      <div class="best" id="bestStart"></div>
      <button class="btn" id="btnStart" type="button">▶ 開始演奏</button>
      <div class="keys-hint">Enter / 空白鍵開始 · P 暫停 · M 靜音</div>
    </div>

    <div class="overlay hidden" id="ovPause">
      <div class="ov-title">已暫停</div>
      <button class="btn" id="btnResume" type="button">繼續</button>
    </div>

    <div class="overlay hidden" id="ovEnd">
      <div class="ov-sub" id="endTitle">演奏結束</div>
      <div class="grade" id="endGrade">S</div>
      <div class="best" id="endAsset"></div>
      <div class="stats" id="endStats"></div>
      <div class="tip" id="endTip"></div>
      <div class="best" id="endBest"></div>
      <button class="btn" id="btnAgain" type="button">↻ 再玩一次</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const W = 480, H = 760, LANES = 4, LW = W / LANES;
  const HIT_Y = 650, TOP_Y = 134, SPEED = 0.52;          // px / ms
  const PERFECT = 55, GOOD = 120;                          // 判定窗口 (ms)
  const START_ASSET = 1000, BANKRUPT = 400;
  const LANE_COL = ['#ff69b4', '#ffe44d', '#7fffb0', '#a855f7'];
  const LANE_KEY = ['D', 'F', 'J', 'K'];
  const KEYMAP = { KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3, ArrowLeft: 0, ArrowDown: 1, ArrowUp: 2, ArrowRight: 3 };
  const BEST_KEY = 'compoundBeat_best';

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.scale(dpr, dpr);

  const $ = id => document.getElementById(id);
  const ovStart = $('ovStart'), ovPause = $('ovPause'), ovEnd = $('ovEnd');

  // ── 最佳紀錄 ──
  function loadBest() { try { return parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {} }
  let best = loadBest();
  function fmt(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
  function refreshBest() { $('bestStart').textContent = best ? '最佳資產 ' + fmt(best) : ''; }
  refreshBest();

  // ── 音效 (WebAudio) ──
  let actx = null, muted = false;
  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (!actx || muted) return;
    try {
      const t = actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const PENTA = [523.25, 587.33, 659.25, 783.99];
  const BASS = [55, 55, 65.41, 73.42];
  function beatSound(b) {
    if (b.strong) { tone(120, 0.16, 'sine', 0.32, 45); tone(BASS[b.bar % 4], 0.3, 'triangle', 0.12); }
    else { tone(7000, 0.03, 'square', 0.025); }
  }
  $('muteBtn').addEventListener('click', toggleMute);
  function toggleMute() { muted = !muted; $('muteBtn').textContent = muted ? '🔇 靜音' : '🔊 音效'; }

  // ── 譜面生成 ──
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const STAGES = [
    { name: '第 1 年 · 打底期', bpm: 100, beats: 32, div: 1, pOn: 0.9, pOff: 0.55, chord: 0,    swan: 0 },
    { name: '第 2 年 · 成長期', bpm: 120, beats: 40, div: 2, pOn: 0.85, pOff: 0.4, chord: 0.12, swan: 0.08 },
    { name: '第 3 年 · 狂熱期', bpm: 140, beats: 48, div: 2, pOn: 0.9, pOff: 0.55, chord: 0.22, swan: 0.1 }
  ];
  let notes = [], beats = [], stageMarks = [], songEnd = 0;
  function buildSong() {
    const rng = mulberry32((Date.now() ^ 0x5bd1e995) >>> 0);
    notes = []; beats = []; stageMarks = [];
    let t = 2200, last = -1, barCount = 0;
    STAGES.forEach((st, si) => {
      const bl = 60000 / st.bpm;
      stageMarks.push({ t: t, name: st.name, bpm: st.bpm, idx: si });
      for (let b = 0; b < st.beats; b++) {
        beats.push({ t: t + b * bl, strong: b % 4 === 0, bar: barCount });
        if (b % 4 === 3) barCount++;
        for (let s = 0; s < st.div; s++) {
          const nt = t + (b + s / st.div) * bl;
          const p = s === 0 ? st.pOn : st.pOff;
          if (rng() >= p) continue;
          let lane = Math.floor(rng() * LANES);
          if (lane === last) lane = (lane + 1 + Math.floor(rng() * (LANES - 1))) % LANES;
          last = lane;
          let type = 'n';
          const r = rng();
          if (si > 0 && r < st.swan) type = 's';
          else if (r > 0.9) type = 'g';
          notes.push({ t: nt, lane: lane, type: type, done: false, res: '' });
          if (type !== 's' && s === 0 && b % 2 === 0 && rng() < st.chord) {
            let l2 = (lane + 1 + Math.floor(rng() * (LANES - 1))) % LANES;
            notes.push({ t: nt, lane: l2, type: 'n', done: false, res: '' });
          }
        }
      }
      t += st.beats * bl;
    });
    songEnd = t + 1200;
  }

  // ── 遊戲狀態 ──
  let state = 'start';                 // start | play | pause | end
  let gameStart = 0, pausedAt = 0, nowMs = 0, bi = 0, stageIdx = 0;
  let asset, peak, maxDD, combo, maxCombo, cntP, cntG, cntMiss, cntSwanHit, cntDodge, cntGold, hitsTotal;
  let history = [], particles = [], floaters = [], flash = [0, 0, 0, 0], pulse = 0, shake = 0, bankrupt = false;
  let stars = [];
  for (let i = 0; i < 70; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + 0.3, s: Math.random() * 0.03 + 0.005, ph: Math.random() * 6.28 });

  function resetGame() {
    buildSong();
    asset = START_ASSET; peak = asset; maxDD = 0; combo = 0; maxCombo = 0;
    cntP = cntG = cntMiss = cntSwanHit = cntDodge = cntGold = hitsTotal = 0;
    history = [asset]; particles = []; floaters = []; flash = [0, 0, 0, 0];
    bi = 0; stageIdx = 0; bankrupt = false; pulse = 0; shake = 0;
  }

  function comboMult() { return 1 + Math.min(combo, 40) / 20; }

  function applyAsset(newVal) {
    asset = newVal;
    if (asset > peak) peak = asset;
    const dd = (peak - asset) / peak;
    if (dd > maxDD) maxDD = dd;
    history.push(asset);
    if (history.length > 400) history.splice(1, 1);
    if (asset < BANKRUPT && state === 'play') { bankrupt = true; endGame(); }
  }

  function burst(x, y, col, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = Math.random() * 3 + 1;
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, life: 1, col: col });
    }
  }
  function floater(txt, x, y, col) { floaters.push({ txt: txt, x: x, y: y, life: 1, col: col }); }

  function judge(lane) {
    if (state !== 'play') return;
    flash[lane] = 1;
    let target = null, bd = 1e9;
    for (let i = 0; i < notes.length; i++) {
      const n = notes[i];
      if (n.done || n.lane !== lane) continue;
      const d = Math.abs(n.t - nowMs);
      if (n.t - nowMs > GOOD + 40) break;      // notes 依時間排序，後面的更晚
      if (d <= GOOD && d < bd) { bd = d; target = n; }
    }
    const cx = lane * LW + LW / 2;
    if (!target) { tone(180, 0.05, 'square', 0.03); return; }
    target.done = true;
    if (target.type === 's') {
      target.res = 'hit';
      cntSwanHit++; combo = 0; shake = 14;
      tone(110, 0.35, 'sawtooth', 0.22, 40);
      floater('黑天鵝 −15%', cx, HIT_Y - 40, '#ff5566');
      burst(cx, HIT_Y, '#ff5566', 22);
      applyAsset(asset * 0.85);
      return;
    }
    const perfect = bd <= PERFECT;
    let r = (perfect ? 0.01 : 0.005) * comboMult();
    if (target.type === 'g') { r *= 2; cntGold++; }
    combo++; if (combo > maxCombo) maxCombo = combo;
    hitsTotal++;
    if (perfect) cntP++; else cntG++;
    const before = asset;
    applyAsset(asset * (1 + r));
    pulse = 1;
    tone(PENTA[lane], 0.12, 'sine', 0.2);
    if (perfect) tone(PENTA[lane] * 2, 0.1, 'triangle', 0.08);
    if (target.type === 'g') tone(1318.5, 0.18, 'sine', 0.14);
    floater((perfect ? 'PERFECT +' : 'GOOD +') + (r * 100).toFixed(1) + '%', cx, HIT_Y - 40, perfect ? LANE_COL[lane] : '#c8c8ff');
    burst(cx, HIT_Y, target.type === 'g' ? '#ffd700' : LANE_COL[lane], perfect ? 14 : 7);
    void before;
  }

  function miss(n) {
    n.done = true; n.res = 'miss';
    cntMiss++; combo = 0;
    floater('漏接 −5%', n.lane * LW + LW / 2, HIT_Y - 30, '#ff8899');
    tone(150, 0.12, 'sawtooth', 0.08, 90);
    applyAsset(asset * 0.95);
  }
  function dodge(n) {
    n.done = true; n.res = 'dodge';
    cntDodge++;
    floater('避險 +0.3%', n.lane * LW + LW / 2, HIT_Y - 30, '#7fffb0');
    applyAsset(asset * 1.003);
  }

  // ── 流程 ──
  function startGame() {
    initAudio();
    resetGame();
    ovStart.classList.add('hidden'); ovEnd.classList.add('hidden'); ovPause.classList.add('hidden');
    state = 'play';
    gameStart = performance.now();
    nowMs = 0;
  }
  function pauseGame() {
    if (state !== 'play') return;
    state = 'pause'; pausedAt = performance.now();
    ovPause.classList.remove('hidden');
  }
  function resumeGame() {
    if (state !== 'pause') return;
    gameStart += performance.now() - pausedAt;
    state = 'play';
    ovPause.classList.add('hidden');
  }
  function endGame() {
    if (state === 'end') return;
    state = 'end';
    const mult = asset / START_ASSET;
    let grade, col, title;
    if (bankrupt) { grade = 'F'; col = '#ff5566'; title = '破產出場'; }
    else if (mult >= 40) { grade = 'S'; col = '#ffd700'; title = '複利之神'; }
    else if (mult >= 15) { grade = 'A'; col = '#7fffb0'; title = '穩健長跑者'; }
    else if (mult >= 6)  { grade = 'B'; col = '#22e0ff'; title = '小有斬獲'; }
    else if (mult >= 2.5){ grade = 'C'; col = '#ffe44d'; title = '平平淡淡'; }
    else                 { grade = 'D'; col = '#ff69b4'; title = '原地踏步'; }
    const finalAsset = Math.round(asset);
    const isNew = finalAsset > best && !bankrupt;
    if (isNew) { best = finalAsset; saveBest(best); }
    const gm = hitsTotal > 0 ? (Math.pow(Math.max(asset, 1) / START_ASSET, 1 / hitsTotal) - 1) : 0;
    const total = cntP + cntG + cntMiss;
    $('endTitle').textContent = title;
    $('endGrade').textContent = grade; $('endGrade').style.color = col; $('endGrade').style.textShadow = '0 0 22px ' + col;
    $('endAsset').textContent = fmt(finalAsset) + '（' + mult.toFixed(1) + ' 倍）';
    $('endStats').innerHTML =
      '<span class="k">最大回撤</span><span class="v">−' + (maxDD * 100).toFixed(1) + '%</span>' +
      '<span class="k">最高連擊</span><span class="v">' + maxCombo + '</span>' +
      '<span class="k">Perfect / Good</span><span class="v">' + cntP + ' / ' + cntG + '</span>' +
      '<span class="k">漏接</span><span class="v">' + cntMiss + (total ? '（' + Math.round(cntMiss / total * 100) + '%）' : '') + '</span>' +
      '<span class="k">黑天鵝：中 / 避</span><span class="v">' + cntSwanHit + ' / ' + cntDodge + '</span>' +
      '<span class="k">幾何平均每筆報酬</span><span class="v">' + (gm * 100).toFixed(2) + '%</span>';
    let tip;
    if (bankrupt) tip = '資產跌破 $400。虧損 15% 需要 +17.6% 才能回本，虧 50% 則要 +100%——回撤比你想的更難爬回來。';
    else if (maxDD > 0.3) tip = '最大回撤達 −' + (maxDD * 100).toFixed(0) + '%：就算最後賺錢，過程中的大幅回撤也很難熬。穩定的連擊才是複利的燃料。';
    else tip = '連擊讓報酬率「滾」起來：整場不是靠某一筆暴賺，而是靠一連串小幅報酬的複利。每次漏接都會讓連擊歸零。';
    $('endTip').textContent = tip;
    $('endBest').textContent = (isNew ? '🎉 新紀錄！ ' : '') + '最佳資產 ' + fmt(best);
    refreshBest();
    ovEnd.classList.remove('hidden');
  }

  // ── 輸入 ──
  window.addEventListener('keydown', function (e) {
    if (e.code in KEYMAP) {
      e.preventDefault();
      if (!e.repeat) judge(KEYMAP[e.code]);
      return;
    }
    if (e.code === 'Enter' || e.code === 'Space') {
      e.preventDefault();
      if (state === 'start' || state === 'end') startGame();
      else if (state === 'pause') resumeGame();
    } else if (e.code === 'KeyP' || e.code === 'Escape') {
      if (state === 'play') pauseGame(); else if (state === 'pause') resumeGame();
    } else if (e.code === 'KeyM') toggleMute();
  });
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    const rect = cv.getBoundingClientRect();
    const lane = Math.max(0, Math.min(LANES - 1, Math.floor((e.clientX - rect.left) / rect.width * LANES)));
    judge(lane);
  });
  $('btnStart').addEventListener('click', startGame);
  $('btnAgain').addEventListener('click', startGame);
  $('btnResume').addEventListener('click', resumeGame);
  document.addEventListener('visibilitychange', function () { if (document.hidden) pauseGame(); });

  // ── 繪圖 ──
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawNote(n, y) {
    const cx = n.lane * LW + LW / 2, w = LW - 22, h = 26;
    if (n.type === 's') {
      ctx.save(); ctx.translate(cx, y);
      ctx.shadowColor = '#ff2244'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#ff3355';
      ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(24, 0); ctx.lineTo(0, 20); ctx.lineTo(-24, 0); ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = '#200008'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('☠', 0, 1);
      ctx.restore();
      return;
    }
    const col = n.type === 'g' ? '#ffd700' : LANE_COL[n.lane];
    ctx.save();
    ctx.shadowColor = col; ctx.shadowBlur = n.type === 'g' ? 18 : 12;
    ctx.fillStyle = col;
    rrect(cx - w / 2, y - h / 2, w, h, 9); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    rrect(cx - w / 2 + 4, y - h / 2 + 3, w - 8, 6, 3); ctx.fill();
    if (n.type === 'g') {
      ctx.fillStyle = '#5a3a00'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('$', cx, y + 2);
    }
    ctx.restore();
  }

  function drawSpark() {
    const x0 = 16, x1 = W - 16, y0 = 78, y1 = 122;
    ctx.strokeStyle = 'rgba(136,136,187,0.25)'; ctx.lineWidth = 1;
    ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
    if (history.length < 2) return;
    let lo = Infinity, hi = -Infinity;
    for (const v of history) { const l = Math.log(v); if (l < lo) lo = l; if (l > hi) hi = l; }
    const base = Math.log(START_ASSET);
    lo = Math.min(lo, base - 0.05); hi = Math.max(hi, base + 0.3);
    const yy = v => y1 - 3 - (Math.log(v) - lo) / (hi - lo) * (y1 - y0 - 6);
    // 起始線
    ctx.setLineDash([3, 4]); ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.moveTo(x0, yy(START_ASSET)); ctx.lineTo(x1, yy(START_ASSET)); ctx.stroke(); ctx.setLineDash([]);
    const grad = ctx.createLinearGradient(x0, 0, x1, 0);
    grad.addColorStop(0, '#ff69b4'); grad.addColorStop(0.5, '#ffe44d'); grad.addColorStop(1, '#7fffb0');
    ctx.strokeStyle = grad; ctx.lineWidth = 2;
    ctx.beginPath();
    history.forEach((v, i) => {
      const x = x0 + (x1 - x0) * i / (history.length - 1 || 1), y = yy(v);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  function draw(dt) {
    ctx.save();
    if (shake > 0) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.86; if (shake < 0.5) shake = 0; }
    // 背景
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0a0a22'); bg.addColorStop(1, '#060612');
    ctx.fillStyle = bg; ctx.fillRect(-10, -10, W + 20, H + 20);
    for (const s of stars) {
      s.y += s.s * dt * (1 + pulse * 3); if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
      const a = 0.35 + 0.35 * Math.sin(performance.now() / 600 + s.ph);
      ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    // 軌道
    for (let l = 0; l < LANES; l++) {
      const g = ctx.createLinearGradient(0, TOP_Y, 0, H);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, hexA(LANE_COL[l], 0.10 + flash[l] * 0.25));
      ctx.fillStyle = g; ctx.fillRect(l * LW, TOP_Y, LW, H - TOP_Y);
      ctx.strokeStyle = 'rgba(168,85,247,0.22)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(l * LW, TOP_Y); ctx.lineTo(l * LW, H); ctx.stroke();
    }
    // 底線
    ctx.save();
    ctx.shadowColor = '#ff69b4'; ctx.shadowBlur = 10 + pulse * 14;
    ctx.strokeStyle = 'rgba(255,105,180,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, HIT_Y); ctx.lineTo(W, HIT_Y); ctx.stroke();
    ctx.restore();
    // 音符
    ctx.save();
    ctx.beginPath(); ctx.rect(0, TOP_Y, W, H - TOP_Y); ctx.clip();
    for (let i = 0; i < notes.length; i++) {
      const n = notes[i];
      if (n.done && n.res !== 'miss' && n.res !== 'dodge') continue;
      const y = HIT_Y - (n.t - nowMs) * SPEED;
      if (y < TOP_Y - 30) break;
      if (y > H + 30) continue;
      if (n.res === 'miss') ctx.globalAlpha = 0.28; else if (n.res === 'dodge') ctx.globalAlpha = 0.25;
      drawNote(n, y);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    // 接收器
    for (let l = 0; l < LANES; l++) {
      const cx = l * LW + LW / 2, f = flash[l];
      ctx.save();
      ctx.shadowColor = LANE_COL[l]; ctx.shadowBlur = 8 + f * 22;
      ctx.strokeStyle = LANE_COL[l]; ctx.lineWidth = 3;
      rrect(cx - (LW - 22) / 2, HIT_Y - 15, LW - 22, 30, 10);
      if (f > 0) { ctx.fillStyle = hexA(LANE_COL[l], 0.15 + f * 0.5); ctx.fill(); }
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = 'rgba(232,232,255,' + (0.45 + f * 0.5) + ')';
      ctx.font = '700 15px Orbitron, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(LANE_KEY[l], cx, HIT_Y + 44);
      flash[l] = Math.max(0, f - dt / 160);
    }
    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= dt / 520;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life; ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, 3, 3);
    }
    ctx.globalAlpha = 1;
    // 浮動文字
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.y -= dt * 0.04; f.life -= dt / 700;
      if (f.life <= 0) { floaters.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, f.life * 1.6); ctx.fillStyle = f.col;
      ctx.font = '700 14px "Noto Sans TC", sans-serif';
      ctx.fillText(f.txt, Math.max(70, Math.min(W - 70, f.x)), f.y);
    }
    ctx.globalAlpha = 1;
    drawHUD();
    ctx.restore();
    pulse = Math.max(0, pulse - dt / 260);
  }

  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  function drawHUD() {
    ctx.fillStyle = 'rgba(6,6,18,0.92)'; ctx.fillRect(0, 0, W, TOP_Y - 2);
    ctx.strokeStyle = 'rgba(168,85,247,0.4)'; ctx.beginPath(); ctx.moveTo(0, TOP_Y - 2); ctx.lineTo(W, TOP_Y - 2); ctx.stroke();
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left'; ctx.fillStyle = '#8888bb'; ctx.font = '12px "Noto Sans TC", sans-serif';
    ctx.fillText('資產', 16, 16);
    const up = asset >= START_ASSET;
    ctx.fillStyle = asset < 600 ? '#ff5566' : (up ? '#7fffb0' : '#ffe44d');
    ctx.font = '900 ' + (30 + pulse * 4) + 'px Orbitron, sans-serif';
    ctx.fillText(fmt(asset), 16, 42);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#8888bb'; ctx.font = '12px "Noto Sans TC", sans-serif';
    ctx.fillText('連擊 · 報酬倍率', W - 16, 16);
    ctx.fillStyle = combo >= 10 ? '#ffe44d' : '#e8e8ff';
    ctx.font = '900 24px Orbitron, sans-serif';
    ctx.fillText(combo + '  ×' + comboMult().toFixed(2), W - 16, 42);
    // 階段 + 進度
    const st = stageMarks[stageIdx];
    ctx.textAlign = 'left'; ctx.fillStyle = '#c8a8ff'; ctx.font = '12px "Noto Sans TC", sans-serif';
    ctx.fillText(st ? st.name + ' · ' + st.bpm + ' BPM' : '', 16, 66);
    ctx.textAlign = 'right'; ctx.fillStyle = '#8888bb';
    const pk = peak > 0 ? (peak - asset) / peak : 0;
    ctx.fillText('目前回撤 −' + (pk * 100).toFixed(1) + '%', W - 16, 66);
    const prog = Math.max(0, Math.min(1, nowMs / songEnd));
    ctx.fillStyle = 'rgba(136,136,187,0.2)'; ctx.fillRect(16, 128, W - 32, 3);
    ctx.fillStyle = '#ff69b4'; ctx.fillRect(16, 128, (W - 32) * prog, 3);
    drawSpark();
  }

  // ── 主迴圈 ──
  let lastT = performance.now();
  function frame(ts) {
    const dt = Math.min(50, ts - lastT); lastT = ts;
    if (state === 'play') {
      nowMs = performance.now() - gameStart;
      while (bi < beats.length && beats[bi].t <= nowMs) {
        if (nowMs - beats[bi].t < 120) beatSound(beats[bi]);
        bi++;
      }
      for (let i = 0; i < stageMarks.length; i++) if (nowMs >= stageMarks[i].t - 200) stageIdx = i;
      for (let i = 0; i < notes.length; i++) {
        const n = notes[i];
        if (n.done) continue;
        if (n.t > nowMs - GOOD) break;
        if (n.type === 's') dodge(n); else miss(n);
        if (state !== 'play') break;
      }
      if (state === 'play' && nowMs >= songEnd) endGame();
    }
    draw(dt);
    requestAnimationFrame(frame);
  }
  resetGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
